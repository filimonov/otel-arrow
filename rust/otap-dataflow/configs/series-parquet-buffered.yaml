# OTLP/gRPC through a durable buffer to an S3-compatible series/values
# Parquet lake: the reference deployment for Grafana Alloy producers.
#
# Pipeline topology:
#
#   otlp receiver --> durable_buffer (WAL) --> series_parquet exporter --> S3
#
# An OK OTLP response means the request is written to the buffer's write-ahead
# log on this host, not yet in the bucket; the exporter's acknowledgement goes
# to the buffer, which retries a failed block until the store takes it. The
# WAL is synced at most every 25ms and on each 100ms tick, so an acknowledged
# request survives a process crash (SIGKILL, OOM) but a host crash or power
# loss can lose the last ~100ms of acknowledged requests. The matching
# producer is `series-parquet.alloy`. `series-parquet-s3.yaml` is the strict
# alternative, whose OK means the rows are in the bucket.
#
# Sizing, alerts and failure behaviour are in the series_parquet exporter
# README, "Deploying with Alloy". Build with
# `--features series-parquet,aws,durable-buffer`, create the bucket and the
# WAL directory before starting. The static credentials come from
# SERIES_S3_ACCESS_KEY_ID and SERIES_S3_SECRET_ACCESS_KEY.
#
# Shutdown: SIGTERM grants 60s. The exporter's drain ends by
#   window.interval + 2 * (flush_retry_deadline + upload.abort_timeout)
#   = 15s + 2 * (15s + 5s) = 55s,
# inside that grace; what it has not written stays in the WAL and is sent
# after the restart.
#
# Usage:
#   df_engine --config configs/series-parquet-buffered.yaml \
#     --http-admin-bind 127.0.0.1:8080
version: otel_dataflow/v1
policies:
  resources:
    # One worker takes about 100k records/s behind the buffer; add a core per
    # 100k/s up to the WAL device's ceiling (README, "Deploying with Alloy").
    core_allocation: {type: core_count, count: 1}
engine:
  telemetry: {reporting_interval: 1s}
groups:
  default:
    pipelines:
      main:
        policies:
          channel_capacity:
            # pdata also caps the receiver's max_concurrent_requests.
            control: {node: 100, pipeline: 100, completion: 100}
            pdata: 128
        nodes:
          receiver:
            type: receiver:otlp
            config:
              protocols:
                grpc:
                  # Bind the address the producers reach.
                  listening_addr: "127.0.0.1:4317"
                  # The response waits for the WAL write (process-crash safe; see the header for power loss).
                  wait_for_result: true
                  # Above Alloy's 10s attempt timeout, so the producer's deadline ends an attempt first.
                  timeout: 15s
                  # Must reach the sum of num_consumers of every producer: a request past it gets RESOURCE_EXHAUSTED, which Alloy drops.
                  max_concurrent_requests: 128
                  # Equal to the exporter's ingress.max_request_bytes: a larger request gets OUT_OF_RANGE, which Alloy retries without end.
                  max_decoding_message_size: 16MiB
          buffer:
            type: processor:durable_buffer
            config:
              # Its own fast device: it writes about twice the ingest bytes (WAL entry plus segment).
              path: /var/lib/otap/series-wal
              # Steady ingest x (window + flush), 0.3GB at 40k lines/s, plus 1x ingest per second of outage: 34min at 40k/s; divided between cores.
              retention_size_cap: 32GiB
              # A full WAL refuses new requests with UNAVAILABLE; producers retry and keep their data.
              size_cap_policy: backpressure
              # No max_age: expiry drops acknowledged data, counted in loss.*{reason=expired}.
              # The exporter checks the framing of OTLP bytes, which Arrow conversion would bypass.
              otlp_handling: pass_through
              # Bundles held in memory until their block commits: 640 x Alloy's 2MiB exports = 1.34GB; carries 640 x 4000 lines / (15s + 5s) = 128k lines/s.
              max_in_flight: 640
          exporter:
            type: exporter:series_parquet
            config:
              storage:
                s3:
                  base_uri: s3://series-test/otel
                  region: us-east-1
                  endpoint: http://127.0.0.1:9000
                  allow_http: true
                  virtual_hosted_style_request: false
                  auth:
                    type: static_credentials
                    access_key_id: "${env:SERIES_S3_ACCESS_KEY_ID:-}"
                    secret_access_key: "${env:SERIES_S3_SECRET_ACCESS_KEY:-}"
              # Store-level retries end below flush_retry_deadline, as startup requires.
              retry:
                max_retries: 5
                init_backoff: 200ms
                max_backoff: 5s
                backoff_base: 2.0
                retry_timeout: 10s
              writer_id: buffered_1
              producer_id_attribute: host.id
              window:
                interval: 15s
                max_block_bytes: 500MiB
                max_requests_per_block: 4096
                # Short: the buffer retries a failed block, and the shutdown bound above must fit 60s.
                flush_retry_deadline: 15s
              ingress:
                max_request_bytes: 16MiB
                max_extracted_bytes: 32MiB
                max_row_bytes: 1MiB
                max_nesting_depth: 32
              series_cache: {max_entries: 200000}
              sorting: {enabled: true, run_target_bytes: 8MiB, merge_chunk_bytes: 16MiB}
              upload: {part_bytes: 8MiB, concurrency: 2, abort_timeout: 5s}
              parquet: {compression: zstd, row_group_bytes: 64MiB, writer_limit_bytes: 96MiB}
              notify_batch: 64
              unsupported: drop
              logs:
                series_attributes: [logger.name]
                denormalize: [resource.service.name]
                values_sort:
                  - {column: series_id, order: asc}
                  - {column: time_unix_nano, order: asc, nulls: last}
              metrics:
                denormalize: [resource.service.name]
                values_sort:
                  - {column: series_id, order: asc}
                  - {column: time_unix_nano, order: asc}
        connections:
          - {from: receiver, to: buffer}
          - {from: buffer, to: exporter}
