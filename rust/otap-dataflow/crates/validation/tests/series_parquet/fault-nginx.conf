#
# The fault front of the series Parquet failure measurements. It runs in the
# disposable fault-tools network namespace, where the engine reaches it as
# http://127.0.0.1:19000. Every request is forwarded unchanged -- URI, query
# string, method, body framing and the signed Host header -- through one of
# two Toxiproxy listeners in the same namespace: values objects through
# 19002, everything else through 19001. Both forward to the same store.
#
# The ports are namespace-local, so parallel rigs never collide; only the
# ports the harness chooses are published on host loopback. Creating
# /control/fail503 (the run's mounted control directory) answers every
# request with 503 until that exact file is removed. Nothing is buffered or
# retried here: a fault reaches the exporter exactly as the store or the
# proxy produced it.
# The log keeps the request length and the full request URI, whose query
# names each multipart step.
events {}
http {
    log_format faults '$msec $request_method $uri $status $upstream_status '
                      '$request_time $upstream_response_time $body_bytes_sent '
                      '$request_length $request_uri';
    access_log /artifacts/nginx-access.log faults;
    map $uri $backend {
        default http://127.0.0.1:19001;
        ~dataset=values/ http://127.0.0.1:19002;
    }
    server {
        listen 19000;
        client_max_body_size 0;
        keepalive_timeout 0;
        location / {
            if (-f /control/fail503) { return 503; }
            proxy_set_header Host $http_host;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_next_upstream off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_pass $backend;
        }
    }
}
