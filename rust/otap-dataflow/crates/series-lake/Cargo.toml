[package]
name = "otel-arrow-dfe-series-lake"
version.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
readme = "README.md"
publish = true
rust-version.workspace = true
description = "Series/values normalization and Parquet sink for OTAP telemetry"
keywords = ["telemetry", "opentelemetry", "otap", "parquet", "arrow"]
categories = ["database-implementations"]

[features]
default = []
# Installs DHAT's global allocator in the `measurement` bench executable,
# for its heap profile only. No library code uses it.
bench-heap = []

[dependencies]
otel-arrow-dfe-pdata.workspace = true
arrow.workspace = true
parquet = { workspace = true, features = ["zstd"] }
object_store = { workspace = true, features = ["fs"] }
chrono.workspace = true
ciborium.workspace = true
hex.workspace = true
xxhash-rust.workspace = true
lru.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true
humantime-serde.workspace = true
# The sink wraps the object store it writes through (see `sink::CreationWatch`).
async-trait.workspace = true
futures.workspace = true

[dev-dependencies]
otel-arrow-dfe-pdata = { workspace = true, features = ["testing"] }
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
tempfile.workspace = true
bytes.workspace = true
cpu-time.workspace = true
criterion.workspace = true
dhat.workspace = true
object_store = { workspace = true, features = ["aws", "fs"] }
otel-arrow-dfe-otap = { workspace = true, features = ["aws", "crypto-ring"] }
prost.workspace = true
sha2.workspace = true

[[bench]]
name = "measurement"
harness = false

[[bench]]
name = "layered"
harness = false

[lints]
workspace = true
