[package]
name = "otel-arrow-dfe-series-lake"
version.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
readme = "README.md"
publish = true
rust-version.workspace = true
description = "Series/values normalization and Parquet sink for OTAP telemetry"
keywords = ["telemetry", "opentelemetry", "otap", "parquet", "arrow"]
categories = ["database-implementations"]

[features]
default = []
# Builds the two harness-driven benches, `measurement` and `layered`, which
# measure the fixtures the series_parquet measurement harness writes. Off by
# default, so a workspace-wide `cargo bench` does not build them.
bench-harness = []
# Installs DHAT's global allocator in the bench executables in place of
# jemalloc, for the `measurement` heap profile only. No library code uses it.
bench-heap = ["bench-harness"]

[dependencies]
otel-arrow-dfe-pdata.workspace = true
arrow.workspace = true
parquet = { workspace = true, features = ["zstd"] }
object_store = { workspace = true, features = ["fs"] }
chrono.workspace = true
base64.workspace = true
ciborium.workspace = true
ciborium-io.workspace = true
ciborium-ll.workspace = true
hex.workspace = true
xxhash-rust.workspace = true
# `HashTable` and its default per-process-seeded hasher for the series memos.
hashbrown.workspace = true
lru.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true
humantime-serde.workspace = true
byte-unit.workspace = true
# The sink wraps the object store it writes through (see `sink::CreationWatch`).
async-trait.workspace = true
futures.workspace = true
# The Parquet writer hands the sink's upload its buffers as `Bytes`.
bytes.workspace = true

[dev-dependencies]
otel-arrow-dfe-pdata = { workspace = true, features = ["testing"] }
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
tempfile.workspace = true
cpu-time.workspace = true
criterion.workspace = true
dhat.workspace = true
object_store = { workspace = true, features = ["aws", "fs"] }
otel-arrow-dfe-otap = { workspace = true, features = ["aws", "crypto-ring"] }
prost.workspace = true
sha2.workspace = true

# The timing benches' global allocator, as the engine's (benches/measurement/allocator.rs).
[target.'cfg(not(windows))'.dev-dependencies]
tikv-jemallocator.workspace = true
tikv-jemalloc-ctl.workspace = true

[[bench]]
name = "measurement"
harness = false
required-features = ["bench-harness"]

[[bench]]
name = "layered"
harness = false
required-features = ["bench-harness"]

[lints]
workspace = true
